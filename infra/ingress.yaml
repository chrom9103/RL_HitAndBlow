apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: strip-hit-and-blow
spec:
  stripPrefix:
    prefixes:
      - /hit-and-blow
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hit-and-blow-ingress
  annotations:
    # /hit-and-blow/foo -> /foo
    traefik.ingress.kubernetes.io/router.middlewares: default-strip-hit-and-blow@kubernetescrd
spec:
  ingressClassName: public
  rules:
    - host: www.chrom.jp
      http:
        paths:
          - path: /hit-and-blow
            pathType: Prefix
            backend:
              service:
                name: hit-and-blow-service
                port:
                  number: 80
  tls:
    - hosts:
        - www.chrom.jp
      secretName: chrom-jp-tls
