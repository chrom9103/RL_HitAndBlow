server {
    listen 8080;
    server_name localhost;

    # Ingress が /hit-and-blow を取り除いて転送してくる
    root /usr/share/nginx/html/hit-and-blow;
    index index.html;

    # ハッシュ付きのビルド成果物は長期キャッシュ
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # CPUの重みはファイル名にハッシュが無いので再検証させる
    location /weights/ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # SPA用フォールバック
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
